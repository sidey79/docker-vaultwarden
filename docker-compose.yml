name: Password save

services:
  backup:
   image: bruceforce/vaultwarden-backup:2.1.6@sha256:3e464a652874b9575c8a8687cf5504d78ce47b6592e63d50dd32e1c5c882e319
   container_name: vw_backup
   depends_on:
     - save
   volumes:
     - ${BASE_STACK_DIR}/backup:/backup
     - bwdata:/data
   environment:
     - BACKUP_DIR=/backup/db_backup/
     - BACKUP_DIR_PERMISSIONS=750
     - BACKUP_ADD_DATABASE=true
     - BACKUP_ADD_ATTACHMENTS=true
     - BACKUP_ADD_CONFIG_JSON=true
     - BACKUP_ADD_RSA_KEY=true
     - BACKUP_ADD_SENDS=false
     - VW_DATA_FOLDER=/data
     - CRON_TIME=26 14,23 * * *
     - TIMESTAMP=true
     - UID=${UID}
     - GID=${GID}
     - TZ=Europe/Berlin
     - DELETE_AFTER=17
   network_mode: none
   restart: on-failure:10
   init: true

  save:
    image: vaultwarden/server:1.37.0-alpine@sha256:88b74551f5d79fd43f897c23bd74d5295a6e1fafb5d1ec23a1da92e7a0f06767
    container_name: bitwarden
    volumes:
      - bwdata:/data
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DOMAIN=https://bitwarden.sidey.blausee.eu
      - SSO_ENABLED=true
      - SSO_ONLY=false
      - SSO_AUTHORITY=https://auth.sidey.blausee.eu
      - SSO_SCOPES=profile email offline_access vaultwarden
      - SSO_PKCE=true
      - SSO_CLIENT_ID=vaultwarden
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET}
      - SSO_ROLES_ENABLED=true
      - SSO_ROLES_DEFAULT_TO_USER=true
      - SSO_ROLES_TOKEN_PATH=/vaultwarden_roles
      - SMTP_HOST=smtp-relay
      - SMTP_PORT=25
      - SMTP_SECURITY=off
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Vaultwarden}
      - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED}
      - ROCKET_PORT=8889
    ports:
      - '8889:8889'
     # - 3012:3012
    networks:
      - backend_net
      - smtp_relay_net
    restart: unless-stopped
    user: "${UID}:${GID}"

networks:
  backend_net:
    external: true
    name: network_backend_net
  smtp_relay_net:
    external: true
    name: smtp_relay_net

volumes:
  bwdata:
    driver: 'local'
    driver_opts:
      type: 'none'
      o: 'bind'
      device: ${BASE_STACK_DIR}/app
